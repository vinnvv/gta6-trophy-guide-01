<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" role="img" aria-label="Hand-sketched editorial map of Leonida regions mentioned in the trophy guide">
  <defs>
    <linearGradient id="seaWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9e4d4"/>
      <stop offset="50%" stop-color="#e3ece8"/>
      <stop offset="100%" stop-color="#ebe4d2"/>
    </linearGradient>
    <pattern id="waveHatch" width="24" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 6 Q6 3 12 6 T24 6" fill="none" stroke="#8ea39b" stroke-width="0.65" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Parchment ocean base -->
  <rect width="960" height="170" rx="8" fill="url(#seaWash)"/>
  <rect width="960" height="170" rx="8" fill="url(#waveHatch)"/>

  <!-- Subtle cartographic graticule -->
  <g stroke="#b7b09d" stroke-width="0.7" stroke-dasharray="3 4" opacity="0.6">
    <line x1="0" y1="44" x2="960" y2="44"/>
    <line x1="0" y1="112" x2="960" y2="112"/>
    <line x1="220" y1="0" x2="220" y2="170"/>
    <line x1="480" y1="0" x2="480" y2="170"/>
    <line x1="740" y1="0" x2="740" y2="170"/>
  </g>

  <!-- Sketched Leonida coastline & peninsula (schematic editorial illustration) -->
  <g fill="#f5efe0" stroke="#2d5a3d" stroke-width="1.6" stroke-linejoin="round">
    <!-- Main Leonida mainland & eastern Vice peninsula -->
    <path d="M58,18 C135,14 218,22 292,26 C365,30 438,16 520,20 C602,24 676,18 756,30 C802,37 838,54 844,78 C849,98 824,116 786,120 C752,124 720,108 686,112 C642,118 606,136 546,132 C490,128 448,112 394,116 C334,120 278,134 214,124 C160,116 112,102 74,84 C44,70 30,44 58,18 Z"/>
    <!-- Western Mariana County / Mile Zero island -->
    <path d="M88,128 C114,122 142,128 154,142 C142,154 108,154 86,144 C78,140 78,131 88,128 Z"/>
    <!-- Southern Leonida Keys / Key Lento chain -->
    <path d="M622,144 C644,139 668,141 678,148 C666,154 638,154 622,144 Z"/>
    <path d="M692,140 C714,135 740,136 752,143 C740,150 710,150 692,140 Z"/>
    <path d="M766,134 C786,129 808,131 818,138 C806,144 780,144 766,134 Z"/>
  </g>

  <!-- Inner topographic contour sketch -->
  <path d="M108,42 C210,38 320,48 430,40 C540,34 655,38 752,52 C790,58 806,74 794,90 C780,106 720,96 668,98 C590,100 520,112 430,102 C330,92 220,104 128,84 C88,74 82,46 108,42 Z"
        fill="none" stroke="#b9ad92" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Dotted Platinum Roadmap route across regions -->
  <path d="M120,139 Q210,114 272,82 T462,64 T646,72 T774,84 Q756,118 722,142"
        fill="none" stroke="#a67200" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>

  <!-- Subtle palm silhouette clusters -->
  <g stroke="#2d5a3d" stroke-width="1.2" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M798,74 Q800,62 804,56 M804,56 Q796,52 791,56 M804,56 Q812,51 816,56 M804,56 Q803,48 798,46"/>
    <path d="M236,72 Q238,61 241,56 M241,56 Q234,53 230,57 M241,56 Q248,52 252,57"/>
  </g>

  <!-- Key Regions from trophies.json -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1a2923">
    <!-- Mile Zero / Mariana -->
    <circle cx="120" cy="139" r="4" fill="#1f543b" stroke="#fffdf8" stroke-width="1.5"/>
    <text x="160" y="144" font-size="9.8" fill="#4f584f">MARIANA COUNTY</text>

    <!-- Port Gellhorn -->
    <circle cx="272" cy="82" r="4.5" fill="#1f543b" stroke="#fffdf8" stroke-width="1.5"/>
    <text x="272" y="100" text-anchor="middle">PORT GELLHORN</text>

    <!-- Kelly County / Ambrosia -->
    <circle cx="462" cy="64" r="4.5" fill="#1f543b" stroke="#fffdf8" stroke-width="1.5"/>
    <text x="462" y="51" text-anchor="middle">KELLY COUNTY &amp; AMBROSIA</text>

    <!-- Belville / Lummox -->
    <circle cx="634" cy="66" r="4" fill="#a67200" stroke="#fffdf8" stroke-width="1.5"/>
    <text x="634" y="53" text-anchor="middle" font-size="9.8" fill="#5e594d">BELVILLE &middot; LUMMOX</text>

    <!-- Vice City & Ocean Beach (Hero Star Pin) -->
    <circle cx="774" cy="84" r="6" fill="#b42318" stroke="#fffdf8" stroke-width="1.8"/>
    <text x="774" y="103" text-anchor="middle" fill="#b42318">VICE CITY &amp; OCEAN BEACH</text>

    <!-- Key Lento -->
    <circle cx="722" cy="142" r="4" fill="#1f543b" stroke="#fffdf8" stroke-width="1.5"/>
    <text x="684" y="161" text-anchor="middle" font-size="9.8" fill="#4f584f">KEY LENTO</text>
  </g>

  <!-- Vintage Compass Rose (top-right) -->
  <g transform="translate(904, 48)" stroke="#1f543b" fill="none">
    <circle cx="0" cy="0" r="22" stroke-width="1" opacity="0.45"/>
    <circle cx="0" cy="0" r="16" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.45"/>
    <polygon points="0,-18 4,-4 0,-7 -4,-4" fill="#1f543b" stroke="none"/>
    <polygon points="0,18 4,4 0,7 -4,4" fill="#b9ad92" stroke="none"/>
    <polygon points="18,0 4,4 7,0 4,-4" fill="#b9ad92" stroke="none"/>
    <polygon points="-18,0 -4,4 -7,0 -4,-4" fill="#b9ad92" stroke="none"/>
    <text x="0" y="-25" text-anchor="middle" font-family="Georgia, serif" font-size="9" font-weight="700" fill="#1f543b" stroke="none">N</text>
  </g>

  <!-- Cartographic Map Legend Tag (top-left) -->
  <g transform="translate(14, 14)">
    <rect width="176" height="22" rx="4" fill="#fffdf8" fill-opacity="0.88" stroke="#d9cfb8" stroke-width="1"/>
    <text x="10" y="14.5" font-family="Georgia, serif" font-size="10.5" font-weight="700" fill="#1a2923">LEONIDA FIELD SKETCH</text>
  </g>
</svg>
