<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" role="img" aria-label="Neon map of the state of Leonida with six official regions">
  <defs>
    <linearGradient id="nightSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0f29"/>
      <stop offset="55%" stop-color="#0b0b1e"/>
      <stop offset="100%" stop-color="#070714"/>
    </linearGradient>

    <linearGradient id="sunsetVertical" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3060CE"/>
      <stop offset="36%" stop-color="#913BC2"/>
      <stop offset="70%" stop-color="#FF5395"/>
      <stop offset="100%" stop-color="#FF944C"/>
    </linearGradient>

    <linearGradient id="landFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1c34"/>
      <stop offset="55%" stop-color="#171726"/>
      <stop offset="100%" stop-color="#241b36"/>
    </linearGradient>

    <linearGradient id="coastStroke" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0%" stop-color="#2de2e6"/>
      <stop offset="48%" stop-color="#4de3d1"/>
      <stop offset="72%" stop-color="#ffb2c6"/>
      <stop offset="100%" stop-color="#FF5395"/>
    </linearGradient>

    <filter id="glowCyan" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2f2e52" stroke-width="0.65" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="960" height="170" fill="url(#nightSea)"/>

  <rect width="960" height="170" fill="url(#grid)"/>

