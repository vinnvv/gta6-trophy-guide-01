<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 320" role="img" aria-label="Stylised neon map of Leonida showing Mount Kalaga, Ambrosia, Port Gellhorn, Vice City, Ocean Beach, Grassrivers and the Leonida Keys">
  <title>Leonida map</title>
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.45" stop-color="#db2777"/>
      <stop offset="0.8" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="coast" x1="0" y1="0" x2="1" y2="0.55">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.45" stop-color="#818cf8"/>
      <stop offset="0.75" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.35" stop-color="#a855f7"/>
      <stop offset="0.7" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#94a3ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="sunClip">
      <circle cx="72" cy="240" r="50"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1160" height="320" fill="#0b0e20"/>
  <rect x="0" y="0" width="1160" height="320" fill="url(#grid)"/>

  <rect x="0" y="0" width="1160" height="3" fill="url(#frame)"/>
  <rect x="0" y="317" width="1160" height="3" fill="url(#frame)"/>

  <path d="M18 34V18h16" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
  <path d="M1126 18h16v16" fill="none" stroke="#f97316" stroke-width="2.5"/>
  <path d="M18 286v16h16" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
  <path d="M1126 302h16v-16" fill="none" stroke="#f97316" stroke-width="2.5"/>

  <g>
