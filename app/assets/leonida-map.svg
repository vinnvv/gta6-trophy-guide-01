    <circle cx="52" cy="232" r="3" fill="#05060f"/>
    <circle cx="60" cy="234" r="3" fill="#05060f"/>
  </g>

  <path d="M296 142 C330 96 440 60 556 56 C668 52 762 76 808 124 C836 152 840 176 820 196 C788 224 716 240 636 242 C556 244 470 234 422 214 C398 204 388 194 396 182 C403 171 384 160 356 152 C334 146 312 144 296 142 Z"
    fill="#131838" fill-opacity="0.7" stroke="url(#coast)" stroke-width="2.5" stroke-linejoin="round"/>

  <ellipse cx="652" cy="132" rx="54" ry="32" transform="rotate(-14 652 132)" fill="#0b0e20" stroke="#3b82f6" stroke-width="2"/>

