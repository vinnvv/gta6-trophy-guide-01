    <circle cx="1068" cy="104" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="1068" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">N</text>
    <polygon points="1068,80 1077,106 1068,100 1059,106" fill="#ec4899"/>
    <polygon points="1068,128 1077,102 1068,108 1059,102" fill="#22d3ee"/>
