    <circle cx="318" cy="148" r="5" fill="#22d3ee" stroke="#0b0e20" stroke-width="2"/>
    <text x="306" y="153" text-anchor="end">Port Gellhorn</text>

    <circle cx="572" cy="168" r="5" fill="#22d3ee" stroke="#0b0e20" stroke-width="2"/>
    <text x="560" y="173" text-anchor="end">Ambrosia</text>

    <circle cx="560" cy="212" r="5" fill="#22d3ee" stroke="#0b0e20" stroke-width="2"/>
    <text x="574" y="217">Grassrivers</text>

    <circle cx="500" cy="274" r="5" fill="#22d3ee" stroke="#0b0e20" stroke-width="2"/>
    <text x="514" y="279">Leonida Keys</text>

    <circle cx="818" cy="186" r="7" fill="none" stroke="#f472b6" stroke-width="2.5"/>
